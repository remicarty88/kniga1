<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#000000" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Bookify — читай, слушай и открывай новые книги." />
<title>Bookify</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body data-mode="listen">

<header class="topbar" id="topbar">
  <div class="brand">
    <span class="brand-name">Bookify</span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" id="btn-mode" aria-label="Читать или слушать" title="Читать или слушать">
      <svg class="i-head" viewBox="0 0 24 24" fill="none"><path d="M3 18v-6a9 9 0 0 1 18 0v6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" fill="currentColor"/></svg>
      <svg class="i-book" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 7.5v6.2M9 7.5l4.6 2.4L9 12.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" aria-label="Сменить тему" title="Сменить тему">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 16C14.2091 16 16 14.2091 16 12C16 9.79086 14.2091 8 12 8C9.79086 8 8 9.79086 8 12C8 14.2091 9.79086 16 12 16ZM12 18C15.3137 18 18 15.3137 18 12C18 8.68629 15.3137 6 12 6C8.68629 6 6 8.68629 6 12C6 15.3137 8.68629 18 12 18Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M11 0H13V4.06189C12.6724 4.02104 12.3387 4 12 4C11.6613 4 11.3276 4.02104 11 4.06189V0ZM7.0943 5.68018L4.22173 2.80761L2.80752 4.22183L5.6801 7.09441C6.09071 6.56618 6.56608 6.0908 7.0943 5.68018ZM4.06189 11H0V13H4.06189C4.02104 12.6724 4 12.3387 4 12C4 11.6613 4.02104 11.3276 4.06189 11ZM5.6801 16.9056L2.80751 19.7782L4.22173 21.1924L7.0943 18.3198C6.56608 17.9092 6.09071 17.4338 5.6801 16.9056ZM11 19.9381V24H13V19.9381C12.6724 19.979 12.3387 20 12 20C11.6613 20 11.3276 19.979 11 19.9381ZM16.9056 18.3199L19.7781 21.1924L21.1923 19.7782L18.3198 16.9057C17.9092 17.4339 17.4338 17.9093 16.9056 18.3199ZM19.9381 13H24V11H19.9381C19.979 11.3276 20 11.6613 20 12C20 12.3387 19.979 12.6724 19.9381 13ZM18.3198 7.0943L21.1923 4.22183L19.7781 2.80762L16.9056 5.6801C17.4338 6.09071 17.9092 6.56608 18.3198 7.0943Z" fill="currentColor"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.2256 2.00253C9.59172 1.94346 6.93894 2.9189 4.92893 4.92891C1.02369 8.83415 1.02369 15.1658 4.92893 19.071C8.83418 22.9763 15.1658 22.9763 19.0711 19.071C21.0811 17.061 22.0565 14.4082 21.9975 11.7743C21.9796 10.9772 21.8669 10.1818 21.6595 9.40643C21.0933 9.9488 20.5078 10.4276 19.9163 10.8425C18.5649 11.7906 17.1826 12.4053 15.9301 12.6837C14.0241 13.1072 12.7156 12.7156 12 12C11.2844 11.2844 10.8928 9.97588 11.3163 8.0699C11.5947 6.81738 12.2094 5.43511 13.1575 4.08368C13.5724 3.49221 14.0512 2.90664 14.5935 2.34046C13.8182 2.13305 13.0228 2.02041 12.2256 2.00253ZM17.6569 17.6568C18.9081 16.4056 19.6582 14.8431 19.9072 13.2186C16.3611 15.2643 12.638 15.4664 10.5858 13.4142C8.53361 11.362 8.73568 7.63895 10.7814 4.09281C9.1569 4.34184 7.59434 5.09193 6.34315 6.34313C3.21895 9.46732 3.21895 14.5326 6.34315 17.6568C9.46734 20.781 14.5327 20.781 17.6569 17.6568Z" fill="currentColor"/></svg>
    </button>
<button class="icon-btn" id="btn-search" aria-label="Поиск" title="Поиск">
      <svg viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.319 14.4326C20.7628 11.2941 20.542 6.75347 17.6569 3.86829C14.5327 0.744098 9.46734 0.744098 6.34315 3.86829C3.21895 6.99249 3.21895 12.0578 6.34315 15.182C9.22833 18.0672 13.769 18.2879 16.9075 15.8442C16.921 15.8595 16.9351 15.8745 16.9497 15.8891L21.1924 20.1317C21.5829 20.5223 22.2161 20.5223 22.6066 20.1317C22.9971 19.7412 22.9971 19.1081 22.6066 18.7175L18.364 14.4749C18.3493 14.4603 18.3343 14.4462 18.319 14.4326ZM16.2426 5.28251C18.5858 7.62565 18.5858 11.4246 16.2426 13.7678C13.8995 16.1109 10.1005 16.1109 7.75736 13.7678C5.41421 13.4246 5.41421 7.62565 7.75736 5.28251C10.1005 2.93936 13.8995 2.93936 16.2426 5.28251Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<div class="headbar" id="headbar">
  <nav class="nav-chips" id="chips">
    <button class="chip-tab" data-m="listen" data-cat="new">Новинки</button>
    <button class="chip-tab" data-m="listen" data-cat="popular">Популярное</button>
    <button class="chip-tab" data-m="listen" data-cat="rating">Рейтинг</button>
    <button class="chip-tab" data-m="listen" data-cat="genres">Жанры</button>
    <button class="chip-tab" data-m="read" data-cat="new">Новинки</button>
    <button class="chip-tab" data-m="read" data-cat="genres">Жанры</button>
  </nav>

  <div class="search-bar is-hidden" id="search-bar">
    <div class="search-row">
    <label class="search-field">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M18.319 14.4326C20.7628 11.2941 20.542 6.75347 17.6569 3.86829C14.5327 0.744098 9.46734 0.744098 6.34315 3.86829C3.21895 6.99249 3.21895 12.0578 6.34315 15.182C9.22833 18.0672 13.769 18.2879 16.9075 15.8442C16.921 15.8595 16.9351 15.8745 16.9497 15.8891L21.1924 20.1317C21.5829 20.5223 22.2161 20.5223 22.6066 20.1317C22.9971 19.7412 22.9971 19.1081 22.6066 18.7175L18.364 14.4749C18.3493 14.4603 18.3343 14.4462 18.319 14.4326ZM16.2426 5.28251C18.5858 7.62565 18.5858 11.4246 16.2426 13.7678C13.8995 16.1109 10.1005 16.1109 7.75736 13.7678C5.41421 11.4246 5.41421 7.62565 7.75736 5.28251C10.1005 2.93936 13.8995 2.93936 16.2426 5.28251Z" fill="currentColor"/></svg>
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Книга, автор или чтец" aria-label="Поиск" />
      <button type="button" class="search-clear is-hidden" id="search-clear" aria-label="Очистить"><svg viewBox="0 0 24 24" fill="none"><path d="M6.2253 4.81108C5.83477 4.42056 5.20161 4.42056 4.81108 4.81108C4.42056 5.20161 4.42056 5.83477 4.81108 6.2253L10.5858 12L4.81114 17.7747C4.42062 18.1652 4.42062 18.7984 4.81114 19.1889C5.20167 19.5794 5.83483 19.5794 6.22535 19.1889L12 13.4142L17.7747 19.1889C18.1652 19.5794 18.7984 19.5794 19.1889 19.1889C19.5794 18.7984 19.5794 18.1652 19.1889 17.7747L13.4142 12L19.189 6.2253C19.5795 5.83477 19.5795 5.20161 19.189 4.81108C18.7985 4.42056 18.1653 4.42056 17.7748 4.81108L12 10.5858L6.2253 4.81108Z" fill="currentColor"/></svg></button>
    </label>
    <button type="button" class="search-cancel" id="search-cancel">Отмена</button>
    </div>
    <div class="search-modes" id="search-modes" role="tablist" aria-label="Что искать">
      <button type="button" class="search-mode is-active" data-sm="audio" role="tab">Аудиокниги</button>
      <button type="button" class="search-mode" data-sm="read" role="tab">Читать</button>
    </div>
  </div>
</div>

<main class="view" id="view" aria-live="polite"></main>
<div class="sentinel" id="sentinel"></div>
<div class="tail" id="tail"></div>

<button class="to-top" id="to-top" hidden aria-label="Наверх">
  <svg viewBox="0 0 24 24" fill="none"><path d="M17.6568 8.96219L16.2393 10.3731L12.9843 7.10285L12.9706 20.7079L10.9706 20.7059L10.9843 7.13806L7.75404 10.3532L6.34314 8.93572L12.0132 3.29211L17.6568 8.96219Z" fill="currentColor"/></svg>
</button>

<!-- Нижний таб-бар -->
<nav class="tabbar" id="tabbar" aria-label="Навигация">
  <button class="tabbar-btn" data-tab="cat" aria-label="Главная">
    <svg viewBox="0 0 24 24" fill="none"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="tabbar-label">Главная</span>
  </button>
  <button class="tabbar-btn" data-tab="lib" aria-label="Библиотека">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5a2.5 2.5 0 0 1 2.5 2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span class="tabbar-label">Библиотека</span>
  </button>
  <button class="tabbar-btn" data-tab="audio" aria-label="Аудио">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 10v4m4-8v12m4-15v18m4-14v10m4-7v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span class="tabbar-label">Аудио</span>
  </button>
  <button class="tabbar-btn" data-tab="read" aria-label="Читать">
    <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v17H6.5A2.5 2.5 0 0 0 4 22zM20 5.5A2.5 2.5 0 0 0 17.5 3H13v17h4.5a2.5 2.5 0 0 1 2.5 2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    <span class="tabbar-label">Читать</span>
  </button>
  <button class="tabbar-btn" data-tab="offline" aria-label="Офлайн">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 16v4h14v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="tabbar-label">Офлайн</span>
  </button>
</nav>

<!-- Мини-плеер -->
<div class="mini is-hidden" id="mini">
  <div class="mini-progress"><span id="mini-bar"></span></div>
  <div class="mini-inner" id="mini-open">
    <img class="mini-cover" id="mini-cover" alt="" />
    <div class="mini-meta">
      <div class="mini-title" id="mini-title">—</div>
      <div class="mini-sub" id="mini-sub">—</div>
    </div>
    <button class="mini-btn" id="mini-play" aria-label="Играть / пауза">
      <svg class="i-play" viewBox="3 2 18 20" fill="none"><path d="M15 12.3301L9 16.6603L9 8L15 12.3301Z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="none"><path d="M11 7H8V17H11V7Z" fill="currentColor"/><path d="M13 17H16V7H13V17Z" fill="currentColor"/></svg>
    </button>
    <button class="mini-close" id="mini-close" aria-label="Закрыть аудиокнигу" title="Закрыть аудиокнигу">
      <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<!-- Полный плеер -->
<div class="sheet is-hidden" id="sheet" role="dialog" aria-modal="true">
  <div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet-body" id="sheet-body">
    <div class="sheet-amb" id="sheet-amb"></div>

    <div class="sheet-head">
      <span class="sheet-grab" id="sheet-grab" aria-hidden="true"></span>
      <button class="sheet-min" id="sheet-close" aria-label="Свернуть плеер">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6.34317 7.75732L4.92896 9.17154L12 16.2426L19.0711 9.17157L17.6569 7.75735L12 13.4142L6.34317 7.75732Z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="sheet-main">
      <div class="sheet-cover-wrap">
        <img class="sheet-cover" id="sheet-cover" alt="" />
      </div>

      <div class="sheet-meta">
        <div class="sheet-title" id="sheet-title">—</div>
        <div class="sheet-sub" id="sheet-sub">—</div>
      </div>

      <div class="sheet-progress">
        <input class="sheet-seek" id="sheet-seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Позиция" />
        <div class="sheet-times"><span id="sheet-cur">0:00</span><span id="sheet-dur">0:00</span></div>
      </div>

      <div class="sheet-controls">
        <button class="ctrl" id="ctrl-prev" aria-label="Предыдущая глава">
          <svg viewBox="0 0 24 24" fill="none"><path d="M18 17L10 12L18 7V17Z" fill="currentColor"/><path d="M6 7H9V17H6V7Z" fill="currentColor"/></svg>
        </button>
        <button class="ctrl ctrl-seek" id="ctrl-back" aria-label="Назад 15 секунд">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.33929 4.46777H7.33929V7.02487C8.52931 6.08978 10.0299 5.53207 11.6607 5.53207C15.5267 5.53207 18.6607 8.66608 18.6607 12.5321C18.6607 16.3981 15.5267 19.5321 11.6607 19.5321C9.51025 19.5321 7.58625 18.5623 6.30219 17.0363L7.92151 15.8515C8.83741 16.8825 10.1732 17.5321 11.6607 17.5321C14.4222 17.5321 16.6607 15.2935 16.6607 12.5321C16.6607 9.77065 14.4222 7.53207 11.6607 7.53207C10.5739 7.53207 9.56805 7.87884 8.74779 8.46777H11.3393V10.4678H5.33929V4.46777Z" fill="currentColor"/></svg><span class="ctrl-amount">15</span>
        </button>
        <button class="ctrl ctrl-main" id="ctrl-play" aria-label="Играть / пауза">
          <svg class="i-play" viewBox="3 2 18 20" fill="none"><path d="M15 12.3301L9 16.6603L9 8L15 12.3301Z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="none"><path d="M11 7H8V17H11V7Z" fill="currentColor"/><path d="M13 17H16V7H13V17Z" fill="currentColor"/></svg>
        </button>
        <button class="ctrl ctrl-seek" id="ctrl-fwd" aria-label="Вперёд 30 секунд">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.1459 11.0499L12.9716 9.05752L15.3462 8.84977C14.4471 7.98322 13.2242 7.4503 11.8769 7.4503C9.11547 7.4503 6.87689 9.68888 6.87689 12.4503C6.87689 15.2117 9.11547 17.4503 11.8769 17.4503C13.6977 17.4503 15.2911 16.4771 16.1654 15.0224L18.1682 15.5231C17.0301 17.8487 14.6405 19.4503 11.8769 19.4503C8.0109 19.4503 4.87689 16.3163 4.87689 12.4503C4.87689 8.58431 8.0109 5.4503 11.8769 5.4503C13.8233 5.4503 15.5842 6.24474 16.853 7.52706L16.6078 4.72412L18.6002 4.5498L19.1231 10.527L13.1459 11.0499Z" fill="currentColor"/></svg><span class="ctrl-amount">30</span>
        </button>
        <button class="ctrl" id="ctrl-next" aria-label="Следующая глава">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 17L14 12L6 7V17Z" fill="currentColor"/><path d="M18 7H15V12V17H18V7Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

    <div class="sheet-chapters" id="sheet-chapters"></div>
  </div>
</div>

<!-- Карточка загрузки -->
<div class="dl-card is-hidden" id="dl-card">
  <div class="dl-row">
    <svg class="dl-ico" viewBox="0 0 24 24" fill="none"><path d="M12 3v11M12 14l-4.5-4.5M12 14l4.5-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16.5v2A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <div class="dl-meta">
      <div class="dl-title" id="dl-title">—</div>
      <div class="dl-sub" id="dl-sub">—</div>
    </div>
    <button class="dl-cancel" id="dl-cancel" aria-label="Остановить загрузку"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="dl-bar"><span id="dl-fill"></span></div>
</div>

<div class="toast" id="toast"></div>

<!-- Скрытый контейнер встроенного поиска (используется для поиска книг для чтения) -->
<div class="cse-hidden" id="cse-hidden" aria-hidden="true"></div>

<audio id="audio" preload="metadata"></audio>
<script src="app.js"></script>
</body>
</html>
